<!-- index.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFilm — учим язык по фильмам</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <!--<div class="logo">LinguaFilm</div>-->
        <a href="index.html" class="logo">LinguaFilm</a>
        <nav class="nav">
            <ul>
                <li><a href="#home">Главная</a></li>
                <li><a href="library.html">Библиотека</a></li>
                <li><a href="profile.html">Профиль</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section id="home" class="hero">
            <h1>Учи язык через кино и мультфильмы!</h1>
            <p>Смотрите фрагменты, повторяйте фразы, улучшайте понимание на слух.</p>
            <p>Нажмите на любой модуль, чтобы начать урок</p>
        </section>

        

         <!-- Сетка модулей "змейкой" (заменил блок с фильмами) -->
        <section class="modules-grid" id="modulesContainer">
            <!-- Модули будут сгенерированы через JS -->
        </section>
    </main>

    <!-- Общий модальный плеер -->
    <div id="player" class="modal hidden">
        <div class="modal-content">
            <span class="close" id="closePlayer">&times;</span>
            <h2 id="lessonTitle"></h2>
            <video controls width="100%" id="clipVideo">
                Ваш браузер не поддерживает видео.
            </video>
            <div class="phrases-list">
                <h4>Фразы для изучения:</h4>
                <ul id="transcriptList"></ul>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 LinguaFilm. Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
